<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check real-time ÖBB train seat availability between Linz and Vienna">
    <title>ÖBB Train Seat Availability - Linz to Vienna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: grid;
            gap: 20px;
        }

        .train-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .train-card:hover {
            transform: translateY(-5px);
        }

        .train-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .train-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
        }

        .train-category {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .train-times {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        .time-info {
            text-align: center;
        }

        .time-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .time {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
        }

        .station {
            font-size: 1rem;
            color: #666;
            margin-top: 5px;
        }

        .duration {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .duration-icon {
            font-size: 1.5rem;
        }

        .duration-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .train-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .availability {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .available {
            background: #d4edda;
            color: #155724;
        }

        .limited {
            background: #fff3cd;
            color: #856404;
        }

        .unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
        }

        .delay {
            color: #dc3545;
            font-weight: 600;
            margin-left: 10px;
        }

        .platform {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: 600;
        }

        .occupancy-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .occupancy-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .occupancy-low {
            background: linear-gradient(90deg, #28a745, #20c997);
        }

        .occupancy-medium {
            background: linear-gradient(90deg, #ffc107, #ff9800);
        }

        .occupancy-high {
            background: linear-gradient(90deg, #ff5722, #dc3545);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚆 ÖBB Train Availability</h1>
            <p class="subtitle">Linz → Vienna Train Connections</p>
        </div>

        <div class="controls">
            <div class="form-group">
                <div>
                    <label for="fromStation">From Station</label>
                    <input type="text" id="fromStation" value="Linz Hbf" placeholder="e.g., Linz Hbf">
                </div>
                <div>
                    <label for="toStation">To Station</label>
                    <input type="text" id="toStation" value="Wien Hbf" placeholder="e.g., Wien Hbf">
                </div>
                <div>
                    <label for="dateTime">Date & Time</label>
                    <input type="datetime-local" id="dateTime">
                </div>
            </div>
            <button id="searchBtn" onclick="searchTrains()">Search Trains</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Fetching train connections from ÖBB...</p>
        </div>

        <div id="resultsDiv" class="results"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

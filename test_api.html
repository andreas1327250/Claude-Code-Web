<!DOCTYPE html>
<html>
<head>
    <title>ÖBB API Version Tester</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #444; }
        .success { background: #1e3a1e; border-color: #4ec94e; }
        .error { background: #3a1e1e; border-color: #c94e4e; }
        pre { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>ÖBB API Version Tester</h1>
    <p>Testing different version/extension combinations...</p>
    <div id="results"></div>

    <script>
const CORS_PROXY = 'https://corsproxy.io/?';
const API_ENDPOINT = 'https://fahrplan.oebb.at/bin/mgate.exe';

const versions = [
    { ver: '1.57', ext: 'OEBB.15', v: '6060900' },
    { ver: '1.65', ext: 'OEBB.17', v: '6080600' },
    { ver: '1.68', ext: 'OEBB.18', v: '6100000' },
    { ver: '1.62', ext: 'OEBB.16', v: '6070000' },
    { ver: '1.70', ext: 'OEBB.19', v: '6120000' },
];

async function testVersion(config) {
    const body = {
        auth: { type: "AID", aid: "OWDL4fE4ixNiPBBm" },
        client: { id: "OEBB", type: "AND", name: "oebbANDROID", v: config.v },
        ver: config.ver,
        ext: config.ext,
        lang: "deu",
        svcReqL: [{
            meth: "LocMatch",
            req: { input: { loc: { name: "Wien", type: "S" }, maxLoc: 1 } }
        }]
    };

    try {
        const response = await fetch(CORS_PROXY + encodeURIComponent(API_ENDPOINT), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        const div = document.createElement('div');

        if (data.err === 'OK' && data.svcResL && data.svcResL[0].err === 'OK') {
            div.className = 'test success';
            div.innerHTML = `
                <strong>✅ SUCCESS</strong><br>
                ver: ${config.ver}, ext: ${config.ext}, v: ${config.v}<br>
                <pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
            `;
            console.log('WORKING CONFIG:', config);
        } else {
            div.className = 'test error';
            div.innerHTML = `
                <strong>❌ FAILED</strong><br>
                ver: ${config.ver}, ext: ${config.ext}, v: ${config.v}<br>
                Error: ${data.err || data.svcResL?.[0]?.err || 'Unknown'}<br>
                <pre>${JSON.stringify(data, null, 2).substring(0, 300)}</pre>
            `;
        }

        document.getElementById('results').appendChild(div);
        return data;
    } catch (error) {
        const div = document.createElement('div');
        div.className = 'test error';
        div.innerHTML = `
            <strong>❌ NETWORK ERROR</strong><br>
            ver: ${config.ver}, ext: ${config.ext}<br>
            ${error.message}
        `;
        document.getElementById('results').appendChild(div);
    }
}

// Test all versions sequentially
async function runTests() {
    for (const config of versions) {
        await testVersion(config);
        await new Promise(r => setTimeout(r, 1000)); // Wait 1 sec between tests
    }
    console.log('All tests complete!');
}

runTests();
    </script>
</body>
</html>
